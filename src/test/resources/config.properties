# Automation Execution Type selenium/playwright
com.propertyzar.ui.config.automation-tool=PLAYWRIGHT

#OperatingSystemConfig
com.propertyzar.ui.config.os.name=WINDOWS

#Browserconfig
com.propertyzar.ui.config.browser=chromium,firefox,webkit
com.propertyzar.ui.config.playwright.isHeadless=false
com.propertyzar.ui.config.data-folder=src/test/resources/data/

#Chrome Browser Settings
com.propertyzar.ui.config.playwright.chrome.binary=chromium
com.propertyzar.ui.config.playwright.chrome.channel=chrome

#Firefox Browser Settings
com.propertyzar.ui.config.playwright.firefox.binary=firefox
com.propertyzar.ui.config.playwright.firefox.channel=firefox

#WebKit Browser Settings
com.propertyzar.ui.config.playwright.webkit.binary=webkit
com.propertyzar.ui.config.playwright.webkit.channel=webkit


#Attempt
com.propertyzar.ui.config.max-element-attempts=5

#ChannelIntegration
com.propertyzar.ui.config.slack-notification-enabled=true
com.propertyzar.ui.config.default-timeout=30000
com.propertyzar.ui.config.default-explicit-polling-interval=250
com.propertyzar.ui.config.timeout=40000
com.propertyzar.ui.config.maximum-stage-limit=20


#Report Path
com.propertyzar.ui.config.spark-report-path=test-output/Reports

#JSON Files
com.propertyzar.ui.config.login-json-file=Login.json
com.propertyzar.ui.config.owner-json-file=Owner.json



#EncryptionConfig
com.propertyzar.ui.config.encryption.secret-key=TMblFDcszhqhfVkeFBNMMreNHSFyrcSo
com.propertyzar.ui.config.encryption.data-type=EXCEL
com.propertyzar.ui.config.encryption.data-path=encryption_data.xlsx

#Timeout Configuration
com.propertyzar.ui.config.low_level-timeout=10
com.propertyzar.ui.config.mid_level-timeout=20
com.propertyzar.ui.config.high_level-timeout=30
com.propertyzar.ui.config.invisibility-timeout=3
com.propertyzar.ui.config.max-suite-retry-attempts=1



